name: Daily currency rates to Telegram

on:
  schedule:
    # Запуск на ~40 хв раніше потрібного слоту: GitHub стартує заплановані
    # воркфлоу із затримкою до години. Скрипт сам чекає рівної години
    # за Києвом (09:00-18:00) і сам відсіює зайві запуски, тому діапазон
    # 4-15 UTC покриває і літній, і зимовий час.
    - cron: "20 4-15 * * *"
  workflow_dispatch:       # кнопка "Run workflow"
    inputs:
      force:
        description: "Надіслати нову таблицю, навіть якщо курси не змінилися"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rates-post
  cancel-in-progress: false

jobs:
  post-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rates and post to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--no-wait"
            if [ "${{ inputs.force }}" = "true" ]; then
              ARGS="$ARGS --force"
            fi
          fi
          echo "Running with args: $ARGS"
          python fetch_and_post.py $ARGS

      - name: Save rates history for next run
        run: |
          git config user.name "rates-bot"
          git config user.email "actions@github.com"
          git add rates_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update rates history"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
